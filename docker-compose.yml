version: "3.9"
services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - gateway

  gateway:
    build: ./gateway
    ports:
      - "5000:5000"
    environment:
      PRODUCT_SERVICE_URL: http://product-service:5002
      USER_SERVICE_URL: http://user-service:5001
      ORDER_SERVICE_URL: http://order-service:5003
    depends_on:
      - product-service
      - user-service
      - order-service

  product-service:
    build: ./services/product-service
    ports:
      - "5002:5002"
    environment:
      PORT: 5002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: trendora
      DB_USER: postgres
      DB_PASSWORD: postgres123
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trendora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  user-service:
    build: ./services/user-service
    ports:
      - "5001:5001"

  order-service:
    build: ./services/order-service
    ports:
      - "5003:5003"

volumes:
  postgres-data:
