version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - gateway

  gateway:
    build: ./gateway
    ports:
      - "5000:5000"
    depends_on:
      - product-service
      - user-service
      - order-service

  product-service:
    build: ./services/product-service
    ports:
      - "5002:5002"

  user-service:
    build: ./services/user-service
    ports:
      - "5001:5001"

  order-service:
    build: ./services/order-service
    ports:
      - "5003:5003"